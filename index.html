<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Binance Real-Time Monitor</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; margin: 20px; }
        .container { display: flex; flex-direction: column; gap: 20px; }
        table { width: 100%; border-collapse: collapse; background: #1e1e1e; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #2d2d2d; color: #f0b90b; }
        .buy { color: #0ecb81; }
        .sell { color: #f6465d; }
        .alert-box { background: #2d2d2d; padding: 15px; border-radius: 8px; border: 1px solid #f0b90b; }
        input { background: #333; border: 1px solid #444; color: white; padding: 5px; border-radius: 4px; }
        .aggressive { font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body>

    <h2>Binance Live Market Monitor (Top 50 USDT)</h2>
    
    <div class="alert-box">
        <h3>Configurar Alerta</h3>
        <input type="text" id="alertSymbol" placeholder="Ex: BTCUSDT">
        <input type="number" id="minPrice" placeholder="Preço Mínimo">
        <input type="number" id="maxPrice" placeholder="Preço Máximo">
        <button onclick="setAlert()">Definir Alerta</button>
        <div id="activeAlerts"></div>
    </div>

    <table id="marketTable">
        <thead>
            <tr>
                <th>Símbolo</th>
                <th>Preço</th>
                <th>Vol. Comprador</th>
                <th>Vol. Vendedor</th>
                <th>Agressividade</th>
                <th>Lado Dominante</th>
            </tr>
        </thead>
        <tbody id="marketBody">
            <!-- Dados inseridos via JS -->
        </tbody>
    </table>

    <script src="app.js"></script>
</body>
</html>

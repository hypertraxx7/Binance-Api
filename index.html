<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BINANCE CHARTS</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
<style>
/* ════════════════════════════════════════════════
   THEME
════════════════════════════════════════════════ */
:root{
  --buy:#00d48a; --sell:#ff3860;
  --accent:#6366f1; --accent2:#818cf8;
  --mono:'JetBrains Mono',monospace; --sans:'DM Sans',sans-serif;
}
[data-theme="dark"]{
  --bg:#0a0d14; --bg1:#0d1119; --bg2:#111827; --bg3:#1a2235; --bg4:#1e2940; --bg5:#243050;
  --bd:#1f2d45; --bd2:#28395a; --txt:#8bacc6; --hi:#d1e8f8; --dim:#2a3d58; --dim2:#1a2d42;
  --sh:rgba(0,0,0,.8); --chart-bg:#0d1119; --chart-grid:#1a2235;
  --buy-chart:#00d48a; --sell-chart:#ff3860;
}
[data-theme="light"]{
  --bg:#f3f6fb; --bg1:#fff; --bg2:#f8fafd; --bg3:#edf1f8; --bg4:#e2e9f5; --bg5:#d8e2f0;
  --bd:#d2dcea; --bd2:#c0cede; --txt:#4a6280; --hi:#1a2d44; --dim:#aabfd4; --dim2:#c4d4e4;
  --sh:rgba(20,50,100,.08); --chart-bg:#ffffff; --chart-grid:#edf1f8;
  --buy-chart:#059669; --sell-chart:#e11d48;
}

/* ════════════════════════════════════════════════
   RESET
════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--hi);font-family:var(--sans);display:flex;flex-direction:column}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg1)}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}
button{cursor:pointer;font-family:var(--sans)}
input{font-family:var(--sans)}

/* ════════════════════════════════════════════════
   HEADER
════════════════════════════════════════════════ */
.hdr{
  height:44px;background:var(--bg1);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;gap:0;flex-shrink:0;z-index:200;
}
.logo{
  padding:0 16px;border-right:1px solid var(--bd);height:100%;
  display:flex;align-items:center;gap:8px;
  font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:2px;color:var(--hi);
  flex-shrink:0;
}
.logo-mark{
  width:20px;height:20px;background:linear-gradient(135deg,#6366f1,#818cf8);
  border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-size:10px;color:#fff;font-weight:900;
}
.hdr-actions{display:flex;align-items:center;gap:6px;padding:0 12px;flex:1}
.hdr-btn{
  background:var(--bg3);border:1px solid var(--bd);color:var(--txt);
  border-radius:4px;padding:4px 10px;font-family:var(--mono);font-size:9px;font-weight:600;
  letter-spacing:.8px;transition:all .15s;white-space:nowrap;
}
.hdr-btn:hover{background:var(--bg4);color:var(--hi)}
.hdr-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.hdr-sep{width:1px;height:24px;background:var(--bd);margin:0 4px}
.layout-btns{display:flex;gap:4px}
.lbtn{
  background:var(--bg3);border:1px solid var(--bd);color:var(--dim);
  border-radius:3px;padding:4px 7px;font-size:11px;transition:all .15s;
}
.lbtn:hover{background:var(--bg4);color:var(--txt)}
.lbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.hdr-right{display:flex;align-items:center;gap:8px;padding:0 14px;margin-left:auto}
.theme-btn{background:none;border:none;color:var(--txt);font-size:14px;padding:4px;transition:color .15s}
.theme-btn:hover{color:var(--hi)}

/* ════════════════════════════════════════════════
   MAIN BODY — sidebar + chart area
════════════════════════════════════════════════ */
.main{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{
  width:200px;border-right:1px solid var(--bd);background:var(--bg1);
  display:flex;flex-direction:column;flex-shrink:0;
  transition:width .2s;
}
.sidebar.collapsed{width:0;overflow:hidden}

.sb-hdr{padding:8px 10px;border-bottom:1px solid var(--bd);flex-shrink:0}
.sb-search{
  width:100%;background:var(--bg3);border:1px solid var(--bd);
  border-radius:4px;padding:5px 9px;font-family:var(--mono);font-size:10px;
  color:var(--hi);outline:none;transition:border .15s;
}
.sb-search:focus{border-color:var(--accent)}
.sb-search::placeholder{color:var(--dim)}

.sb-filter{display:flex;gap:4px;padding:6px 10px;border-bottom:1px solid var(--bd);flex-shrink:0}
.sf-btn{
  background:var(--bg3);border:1px solid var(--bd);color:var(--dim);
  border-radius:3px;padding:2px 7px;font-family:var(--mono);font-size:8px;
  font-weight:600;letter-spacing:.5px;transition:all .15s;
}
.sf-btn:hover{background:var(--bg4);color:var(--txt)}
.sf-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}

.sb-list{flex:1;overflow-y:auto}
.sb-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:5px 10px;cursor:pointer;border-bottom:1px solid rgba(31,45,69,.3);
  transition:background .1s;
}
.sb-item:hover{background:var(--bg3)}
.sb-item.active{background:rgba(99,102,241,.12);border-left:2px solid var(--accent)}
.sbi-sym{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--hi)}
.sbi-px{font-family:var(--mono);font-size:9px;color:var(--txt)}
.sbi-chg{font-family:var(--mono);font-size:9px;font-weight:600}
.sbi-chg.up{color:var(--buy)} .sbi-chg.dn{color:var(--sell)}

/* ── CHART AREA ── */
.chart-area{flex:1;display:grid;overflow:hidden;gap:1px;background:var(--bd);position:relative}

/* Grid layouts */
.chart-area.layout-1{grid-template-columns:1fr;grid-template-rows:1fr}
.chart-area.layout-2h{grid-template-columns:1fr 1fr;grid-template-rows:1fr}
.chart-area.layout-2v{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
.chart-area.layout-3l{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.chart-area.layout-4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.chart-area.layout-6{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr}

/* ════════════════════════════════════════════════
   CHART PANEL
════════════════════════════════════════════════ */
.chart-panel{
  background:var(--bg1);display:flex;flex-direction:column;
  overflow:hidden;position:relative;min-height:0;
}
.chart-panel.focused{outline:1px solid var(--accent);outline-offset:-1px;z-index:2}

/* Panel toolbar */
.ct{
  display:flex;align-items:center;gap:0;padding:0;
  height:34px;border-bottom:1px solid var(--bd);background:var(--bg2);
  flex-shrink:0;overflow:hidden;
}

/* Symbol selector in toolbar */
.ct-sym{
  display:flex;align-items:center;gap:6px;padding:0 10px;
  border-right:1px solid var(--bd);height:100%;cursor:pointer;
  transition:background .1s;min-width:120px;
}
.ct-sym:hover{background:var(--bg3)}
.ct-sym-name{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--hi)}
.ct-sym-quote{font-family:var(--mono);font-size:8px;color:var(--dim)}

/* Timeframe buttons */
.ct-tfs{display:flex;align-items:center;gap:0;padding:0 4px;border-right:1px solid var(--bd)}
.tfbtn{
  background:none;border:none;color:var(--dim);
  font-family:var(--mono);font-size:9px;font-weight:600;
  padding:4px 6px;border-radius:3px;transition:all .12s;
}
.tfbtn:hover{background:var(--bg4);color:var(--txt)}
.tfbtn.on{background:var(--accent);color:#fff}

/* Indicator button */
.ind-btn{
  background:none;border:none;color:var(--dim);font-family:var(--mono);font-size:9px;
  font-weight:600;padding:0 10px;height:100%;border-right:1px solid var(--bd);
  transition:all .12s;letter-spacing:.5px;
}
.ind-btn:hover{background:var(--bg3);color:var(--txt)}

/* Chart info bar */
.ct-info{display:flex;align-items:center;gap:8px;padding:0 8px;font-family:var(--mono);font-size:9px;flex:1;overflow:hidden}
.ci-o{color:var(--txt)} .ci-h{color:var(--buy)} .ci-l{color:var(--sell)} .ci-c{color:var(--hi)} .ci-v{color:var(--dim)}

/* Chart type & more */
.ct-right{display:flex;align-items:center;gap:4px;padding:0 8px;flex-shrink:0}
.ct-close{background:none;border:none;color:var(--dim);font-size:14px;padding:0 4px;transition:color .15s}
.ct-close:hover{color:var(--sell)}

/* Chart canvas wrapper */
.chart-wrap{flex:1;position:relative;overflow:hidden}
.chart-wrap > *{width:100%!important;height:100%!important}

/* Loading overlay */
.chart-loading{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;
  background:var(--bg1);z-index:10;
}
.chart-loading.hidden{display:none}
.cl-spin{width:24px;height:24px;border:1.5px solid var(--bd2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cl-txt{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}

/* Indicator sub-panel */
.ind-panel{
  height:120px;border-top:1px solid var(--bd);flex-shrink:0;position:relative;overflow:hidden;
}
.ind-panel-label{
  position:absolute;top:4px;left:8px;z-index:5;
  font-family:var(--mono);font-size:8px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;
}
.ind-panel-close{
  position:absolute;top:2px;right:6px;z-index:5;
  background:none;border:none;color:var(--dim);font-size:12px;cursor:pointer;transition:color .15s;
}
.ind-panel-close:hover{color:var(--sell)}

/* ════════════════════════════════════════════════
   SYMBOL PICKER DROPDOWN
════════════════════════════════════════════════ */
.sym-picker{
  position:fixed;z-index:1000;width:280px;
  background:var(--bg1);border:1px solid var(--bd2);border-radius:6px;
  box-shadow:0 8px 32px var(--sh);overflow:hidden;
}
.sp-search{
  width:100%;background:var(--bg2);border:none;border-bottom:1px solid var(--bd);
  padding:9px 12px;font-family:var(--mono);font-size:11px;color:var(--hi);outline:none;
}
.sp-search::placeholder{color:var(--dim)}
.sp-list{max-height:240px;overflow-y:auto}
.sp-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 12px;cursor:pointer;transition:background .1s;
}
.sp-item:hover{background:var(--bg3)}
.sp-item.active{background:rgba(99,102,241,.15)}
.sp-sym{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--hi)}
.sp-vol{font-family:var(--mono);font-size:9px;color:var(--dim)}

/* ════════════════════════════════════════════════
   INDICATOR PICKER
════════════════════════════════════════════════ */
.ind-picker{
  position:fixed;z-index:1000;width:220px;
  background:var(--bg1);border:1px solid var(--bd2);border-radius:6px;
  box-shadow:0 8px 32px var(--sh);overflow:hidden;padding:6px;
}
.ip-section{font-family:var(--mono);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);padding:4px 6px 2px}
.ip-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:5px 8px;cursor:pointer;border-radius:3px;transition:background .1s;
}
.ip-item:hover{background:var(--bg3)}
.ip-name{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--hi)}
.ip-desc{font-family:var(--mono);font-size:8px;color:var(--dim)}
.ip-check{font-size:12px;color:var(--accent)}

/* ════════════════════════════════════════════════
   EMPTY SLOT
════════════════════════════════════════════════ */
.empty-slot{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;background:var(--bg1);cursor:pointer;transition:background .15s;
}
.empty-slot:hover{background:var(--bg2)}
.es-icon{font-size:28px;opacity:.3}
.es-txt{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}

/* ════════════════════════════════════════════════
   WS STATUS
════════════════════════════════════════════════ */
.ws-dot{width:5px;height:5px;border-radius:50%;background:var(--dim);flex-shrink:0}
.ws-dot.ok{background:var(--buy);box-shadow:0 0 4px var(--buy)}
.ws-dot.wait{background:#f59e0b;animation:spin .6s linear infinite}
.ws-dot.err{background:var(--sell)}
</style>
</head>
<body>

<!-- ════════ HEADER ════════ -->
<header class="hdr">
  <div class="logo"><div class="logo-mark">B</div>CHARTS</div>

  <div class="hdr-actions">
    <button class="hdr-btn" onclick="addChart()">＋ Gráfico</button>
    <div class="hdr-sep"></div>
    <div class="layout-btns">
      <button class="lbtn on" id="lbtn-1" title="1 gráfico" onclick="setLayout(1)">▣</button>
      <button class="lbtn" id="lbtn-2h" title="2 horizontal" onclick="setLayout('2h')">◫</button>
      <button class="lbtn" id="lbtn-2v" title="2 vertical" onclick="setLayout('2v')">⬒</button>
      <button class="lbtn" id="lbtn-4" title="4 gráficos" onclick="setLayout(4)">⊞</button>
      <button class="lbtn" id="lbtn-6" title="6 gráficos" onclick="setLayout(6)">⊟</button>
    </div>
    <div class="hdr-sep"></div>
    <button class="hdr-btn" onclick="toggleSidebar()">☰ Símbolos</button>
  </div>

  <div class="hdr-right">
    <div style="display:flex;align-items:center;gap:5px">
      <div class="ws-dot" id="ws-dot-main"></div>
      <span style="font-family:var(--mono);font-size:8px;color:var(--dim)" id="ws-status-txt">WS</span>
    </div>
    <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">☀</button>
  </div>
</header>

<!-- ════════ MAIN ════════ -->
<div class="main">

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sb-hdr">
      <input class="sb-search" id="sb-search" type="text" placeholder="Pesquisar…" oninput="filterSidebar()">
    </div>
    <div class="sb-filter">
      <button class="sf-btn on" onclick="setSbFilter('USDT',this)">USDT</button>
      <button class="sf-btn" onclick="setSbFilter('USDC',this)">USDC</button>
      <button class="sf-btn" onclick="setSbFilter('BTC',this)">BTC</button>
    </div>
    <div class="sb-list" id="sb-list"></div>
  </div>

  <!-- Chart area -->
  <div class="chart-area layout-1" id="chart-area"></div>

</div>

<!-- Symbol picker (dropdown) -->
<div class="sym-picker" id="sym-picker" style="display:none">
  <input class="sp-search" id="sp-search" type="text" placeholder="Pesquisar símbolo…" oninput="filterSymPicker()">
  <div class="sp-list" id="sp-list"></div>
</div>

<!-- Indicator picker -->
<div class="ind-picker" id="ind-picker" style="display:none">
  <div class="ip-section">Médias Móveis</div>
  <div class="ip-item" onclick="toggleIndicator('sma20')"><span class="ip-name">SMA 20</span><span class="ip-desc">Média simples 20</span><span class="ip-check" id="ic-sma20"></span></div>
  <div class="ip-item" onclick="toggleIndicator('sma50')"><span class="ip-name">SMA 50</span><span class="ip-desc">Média simples 50</span><span class="ip-check" id="ic-sma50"></span></div>
  <div class="ip-item" onclick="toggleIndicator('sma200')"><span class="ip-name">SMA 200</span><span class="ip-desc">Média simples 200</span><span class="ip-check" id="ic-sma200"></span></div>
  <div class="ip-item" onclick="toggleIndicator('ema9')"><span class="ip-name">EMA 9</span><span class="ip-desc">Exp. 9</span><span class="ip-check" id="ic-ema9"></span></div>
  <div class="ip-item" onclick="toggleIndicator('ema21')"><span class="ip-name">EMA 21</span><span class="ip-desc">Exp. 21</span><span class="ip-check" id="ic-ema21"></span></div>
  <div class="ip-item" onclick="toggleIndicator('ema55')"><span class="ip-name">EMA 55</span><span class="ip-desc">Exp. 55</span><span class="ip-check" id="ic-ema55"></span></div>
  <div class="ip-item" onclick="toggleIndicator('bb')"><span class="ip-name">Bollinger Bands</span><span class="ip-desc">20, 2σ</span><span class="ip-check" id="ic-bb"></span></div>
  <div class="ip-section">Osciladores</div>
  <div class="ip-item" onclick="toggleIndicator('rsi')"><span class="ip-name">RSI 14</span><span class="ip-desc">Painel separado</span><span class="ip-check" id="ic-rsi"></span></div>
  <div class="ip-item" onclick="toggleIndicator('macd')"><span class="ip-name">MACD</span><span class="ip-desc">12,26,9 — Painel</span><span class="ip-check" id="ic-macd"></span></div>
  <div class="ip-section">Volume</div>
  <div class="ip-item" onclick="toggleIndicator('vol')"><span class="ip-name">Volume</span><span class="ip-desc">Volume por barra</span><span class="ip-check" id="ic-vol"></span></div>
  <div class="ip-item" onclick="toggleIndicator('vwap')"><span class="ip-name">VWAP</span><span class="ip-desc">Volume-weighted avg</span><span class="ip-check" id="ic-vwap"></span></div>
</div>

<script>
'use strict'

/* ═══════════════════════════════════════════════
   THEME
═══════════════════════════════════════════════ */
;(()=>{
  const t=localStorage.getItem('bc-theme')
  if(t){document.documentElement.setAttribute('data-theme',t)}
  document.getElementById('theme-btn').textContent=document.documentElement.getAttribute('data-theme')==='dark'?'☀':'☾'
})()
function toggleTheme(){
  const h=document.documentElement,d=h.getAttribute('data-theme')==='dark'
  h.setAttribute('data-theme',d?'light':'dark')
  document.getElementById('theme-btn').textContent=d?'☾':'☀'
  localStorage.setItem('bc-theme',d?'light':'dark')
  // Repaint all charts with new theme
  CHARTS.forEach(c=>{ if(c.tv) rebuildChartTheme(c) })
}

/* ═══════════════════════════════════════════════
   CONSTANTS
═══════════════════════════════════════════════ */
const REST='https://api.binance.com/api/v3'
const WS_BASE='wss://stream.binance.com:9443/stream'
const TFRAMES=['1m','3m','5m','15m','30m','1h','2h','4h','6h','12h','1d','3d','1w']
const TF_LABELS={
  '1m':'1m','3m':'3m','5m':'5m','15m':'15m','30m':'30m',
  '1h':'1H','2h':'2H','4h':'4H','6h':'6H','12h':'12H',
  '1d':'1D','3d':'3D','1w':'1W'
}
const KLINE_LIMIT=500

const IND_COLORS={
  sma20:'#f59e0b',sma50:'#6366f1',sma200:'#ec4899',
  ema9:'#22d3ee',ema21:'#f97316',ema55:'#a78bfa',
  bb_mid:'#64748b',bb_upper:'#94a3b8',bb_lower:'#94a3b8',
  vwap:'#fbbf24',rsi:'#818cf8',macd_line:'#22d3ee',
  macd_signal:'#f97316',macd_hist_up:'#00d48a',macd_hist_dn:'#ff3860',
}

/* ═══════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════ */
let ALL_SYMBOLS=[]   // {symbol, price, change24h, volume}
let SB_FILTER='USDT'
let CHARTS=[]        // array of chart instances
let FOCUSED_ID=null
let LAYOUT=1
let SB_COLLAPSED=false
let MAIN_WS=null
let MAIN_WS_SUBS=new Set()
let ACTIVE_PICKER=null   // {type:'sym'|'ind', chartId}

/* ═══════════════════════════════════════════════
   INDICATOR MATH
═══════════════════════════════════════════════ */
function calcSMA(data,n){
  const out=[]
  for(let i=0;i<data.length;i++){
    if(i<n-1){continue}
    let sum=0;for(let j=0;j<n;j++)sum+=data[i-j].close
    out.push({time:data[i].time,value:sum/n})
  }
  return out
}

function calcEMA(data,n){
  const k=2/(n+1);const out=[]
  let ema=data.slice(0,n).reduce((a,b)=>a+b.close,0)/n
  out.push({time:data[n-1].time,value:ema})
  for(let i=n;i<data.length;i++){
    ema=data[i].close*k+ema*(1-k)
    out.push({time:data[i].time,value:ema})
  }
  return out
}

function calcBB(data,n=20,mult=2){
  const sma=calcSMA(data,n)
  const out_u=[],out_m=[],out_l=[]
  sma.forEach((s,i)=>{
    const start=i+n-1
    const slice=data.slice(start-n+1,start+1)
    const mean=s.value
    const variance=slice.reduce((a,b)=>a+Math.pow(b.close-mean,2),0)/n
    const sd=Math.sqrt(variance)
    out_m.push({time:s.time,value:mean})
    out_u.push({time:s.time,value:mean+mult*sd})
    out_l.push({time:s.time,value:mean-mult*sd})
  })
  return{mid:out_m,upper:out_u,lower:out_l}
}

function calcRSI(data,n=14){
  const out=[]
  let gains=0,losses=0
  for(let i=1;i<=n;i++){
    const d=data[i].close-data[i-1].close
    d>0?gains+=d:losses-=d
  }
  let avgG=gains/n,avgL=losses/n
  out.push({time:data[n].time,value:avgL===0?100:100-100/(1+avgG/avgL)})
  for(let i=n+1;i<data.length;i++){
    const d=data[i].close-data[i-1].close
    avgG=((n-1)*avgG+(d>0?d:0))/n
    avgL=((n-1)*avgL+(d<0?-d:0))/n
    out.push({time:data[i].time,value:avgL===0?100:100-100/(1+avgG/avgL)})
  }
  return out
}

function calcMACD(data,fast=12,slow=26,sig=9){
  const emaF=calcEMA(data,fast)
  const emaS=calcEMA(data,slow)
  // align by time
  const mapS=new Map(emaS.map(d=>[d.time,d.value]))
  const macdLine=emaF.filter(d=>mapS.has(d.time)).map(d=>({time:d.time,value:d.value-(mapS.get(d.time)||0)}))
  // Signal = EMA of macdLine
  const k=2/(sig+1);const signal=[];let ema=0
  const seedSlice=macdLine.slice(0,sig)
  if(seedSlice.length<sig)return{line:[],signal:[],hist:[]}
  ema=seedSlice.reduce((a,b)=>a+b.value,0)/sig
  signal.push({time:macdLine[sig-1].time,value:ema})
  for(let i=sig;i<macdLine.length;i++){
    ema=macdLine[i].value*k+ema*(1-k)
    signal.push({time:macdLine[i].time,value:ema})
  }
  const mapSig=new Map(signal.map(d=>[d.time,d.value]))
  const hist=macdLine.filter(d=>mapSig.has(d.time)).map(d=>{
    const h=d.value-(mapSig.get(d.time)||0)
    return{time:d.time,value:h,color:h>=0?IND_COLORS.macd_hist_up:IND_COLORS.macd_hist_dn}
  })
  return{line:macdLine,signal,hist}
}

function calcVWAP(data){
  let cumTP=0,cumVol=0
  return data.map(d=>{
    const tp=(d.high+d.low+d.close)/3
    const v=d.volume||0
    cumTP+=tp*v;cumVol+=v
    return{time:d.time,value:cumVol>0?cumTP/cumVol:d.close}
  })
}

/* ═══════════════════════════════════════════════
   BINANCE REST — symbols
═══════════════════════════════════════════════ */
async function loadSymbols(){
  try{
    const r=await fetch(`${REST}/ticker/24hr`)
    const data=await r.json()
    ALL_SYMBOLS=data
      .filter(t=>t.symbol.endsWith('USDT')&&!t.symbol.includes('DOWN')&&!t.symbol.includes('UP')&&!t.symbol.includes('BEAR')&&!t.symbol.includes('BULL'))
      .sort((a,b)=>+b.quoteVolume-+a.quoteVolume)
      .map(t=>({symbol:t.symbol,price:+t.lastPrice,change:+t.priceChangePercent,volume:+t.quoteVolume}))
    renderSidebar()
  }catch(e){console.error('loadSymbols',e)}
}

/* ═══════════════════════════════════════════════
   BINANCE REST — klines
═══════════════════════════════════════════════ */
async function fetchKlines(symbol,interval,limit=KLINE_LIMIT){
  const r=await fetch(`${REST}/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`)
  const raw=await r.json()
  return raw.map(k=>({
    time:k[0]/1000,
    open:+k[1],high:+k[2],low:+k[3],close:+k[4],
    volume:+k[5]
  }))
}

function setSbFilter(q,btn){
  SB_FILTER=q
  document.querySelectorAll('.sf-btn').forEach(b=>b.classList.remove('on'))
  btn.classList.add('on')
  renderSidebar()
}

function filterSidebar(){
  renderSidebar()
}

function renderSidebar(){
  const q=SB_FILTER,search=document.getElementById('sb-search').value.toUpperCase().trim()
  const el=document.getElementById('sb-list');if(!el)return
  const syms=ALL_SYMBOLS
    .filter(s=>s.symbol.endsWith(q)&&(!search||s.symbol.includes(search)))
    .slice(0,150)
  const base=sym=>sym.replace(q,'').replace('USDT','').replace('USDC','').replace('BTC','')
  el.innerHTML=syms.map(s=>`
    <div class="sb-item" data-sym="${s.symbol}" onclick="quickAddChart('${s.symbol}')">
      <span class="sbi-sym">${base(s.symbol)}</span>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:1px">
        <span class="sbi-px">${fP(s.price)}</span>
        <span class="sbi-chg ${s.change>=0?'up':'dn'}">${(s.change>=0?'+':'')+s.change.toFixed(2)}%</span>
      </div>
    </div>`).join('')
}

function updateSidebarPrices(sym,price,change){
  const el=document.querySelector(`.sb-item[data-sym="${sym}"]`)
  if(!el)return
  const px=el.querySelector('.sbi-px');if(px)px.textContent=fP(price)
  const chg=el.querySelector('.sbi-chg')
  if(chg){chg.textContent=(change>=0?'+':'')+change.toFixed(2)+'%';chg.className='sbi-chg '+(change>=0?'up':'dn')}
}

function toggleSidebar(){

}

/* ═══════════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════════ */
const LAYOUT_CLASSES={1:'layout-1','2h':'layout-2h','2v':'layout-2v',3:'layout-3l',4:'layout-4',6:'layout-6'}
const LAYOUT_SLOTS={1:1,'2h':2,'2v':2,3:4,4:4,6:6}

function setLayout(l){
  LAYOUT=l
  document.querySelectorAll('.lbtn').forEach(b=>b.classList.remove('on'))
  const btn=document.getElementById('lbtn-'+l);if(btn)btn.classList.add('on')
  const area=document.getElementById('chart-area')
  area.className='chart-area '+LAYOUT_CLASSES[l]
  // Fill with empty slots if needed
  syncSlots()
}

function syncSlots(){
  const slots=LAYOUT_SLOTS[LAYOUT]||1
  const area=document.getElementById('chart-area')
  // If fewer charts than slots, add empties
  const existing=area.querySelectorAll('.chart-panel,.empty-slot').length
  if(existing<slots){
    for(let i=existing;i<slots;i++){
      const slot=document.createElement('div')
      slot.className='empty-slot'
      slot.innerHTML=`<div class="es-icon">+</div><div class="es-tx">Clica para adicionar gráfico</div>`
      slot.onclick=()=>convertSlotToChart(slot,'BTCUSDT','4h')
      area.appendChild(slot)
    }
  }
}

/* ═══════════════════════════════════════════════
   CHART INSTANCE
═══════════════════════════════════════════════ */
let _chartIdSeq=0

function createChartInstance(sym,tf){
  const id=++_chartIdSeq
  return{
    id,sym,tf,
    tv:null,          // lightweight-charts instance
    series:{},        // {candle, volume, sma20, ...}
    indPanels:{},     // {rsi:{tv,series}, macd:{tv,series}}
    indicators:new Set(['vol']),  // active indicators
    data:[],          // raw klines
    ws:null,          // dedicated kline WS (per chart)
    el:null,          // DOM element
  }
}

function getThemeOpts(){
  const dark=document.documentElement.getAttribute('data-theme')==='dark'
  return{
    layout:{background:{type:'solid',color:dark?'#0d1119':'#ffffff'},textColor:dark?'#8bacc6':'#4a6280'},
    grid:{vertLines:{color:dark?'#1a2235':'#edf1f8',style:1},horzLines:{color:dark?'#1a2235':'#edf1f8',style:1}},
    crosshair:{mode:1,vertLine:{color:dark?'#6366f1':'#818cf8',width:1,style:0,labelBackgroundColor:dark?'#6366f1':'#818cf8'},horzLine:{color:dark?'#6366f1':'#818cf8',width:1,style:0,labelBackgroundColor:dark?'#6366f1':'#818cf8'}},
    timeScale:{borderColor:dark?'#1f2d45':'#d2dcea',timeVisible:true,secondsVisible:false},
    rightPriceScale:{borderColor:dark?'#1f2d45':'#d2dcea'},
  }
}

function rebuildChartTheme(c){
  if(!c.tv||!c.el)return
  const opts=getThemeOpts()
  c.tv.applyOptions(opts)
  Object.values(c.indPanels).forEach(p=>{if(p.tv)p.tv.applyOptions(opts)})
}

async function buildChart(c){
  const el=c.el;if(!el)return
  const wrap=el.querySelector('.chart-wrap');if(!wrap)return

  const loading=el.querySelector('.chart-loading')
  if(loading)loading.classList.remove('hidden')

  // Destroy old
  if(c.tv){try{c.tv.remove()}catch(_){}; c.tv=null}
  Object.values(c.indPanels).forEach(p=>{
    if(p.el)p.el.remove()
    if(p.tv){try{p.tv.remove()}catch(_){}}
  })
  c.indPanels={}; c.series={}

  // Fetch data
  try{c.data=await fetchKlines(c.sym,c.tf)}catch(e){
    console.error('klines fetch failed',e)
    if(loading)loading.classList.add('hidden')
    return
  }

  // Create main chart
  c.tv=LightweightCharts.createChart(wrap,{
    ...getThemeOpts(),
    width:wrap.clientWidth,
    height:wrap.clientHeight,
    handleScroll:{mouseWheel:true,pressedMouseMove:true},
    handleScale:{mouseWheel:true,axisPressedMouseMove:true},
  })

  // Candlestick series
  const dark=document.documentElement.getAttribute('data-theme')==='dark'
  c.series.candle=c.tv.addCandlestickSeries({
    upColor:dark?'#00d48a':'#059669',downColor:dark?'#ff3860':'#e11d48',
    wickUpColor:dark?'#00d48a':'#059669',wickDownColor:dark?'#ff3860':'#e11d48',
    borderVisible:false,
  })
  c.series.candle.setData(c.data)

  // Fit content
  c.tv.timeScale().fitContent()

  // Add active indicators
  applyAllIndicators(c)

  // Subscribe crosshair to update info bar
  c.tv.subscribeCrosshairMove(param=>{
    if(!param.time||!param.seriesData)return
    const bar=param.seriesData.get(c.series.candle)
    if(!bar)return
    updateInfoBar(c,bar)
  })

  // Resize observer
  if(!c._ro){
    c._ro=new ResizeObserver(()=>{
      if(c.tv)c.tv.resize(wrap.clientWidth,wrap.clientHeight)
      Object.values(c.indPanels).forEach(p=>{
        if(p.tv&&p.el)p.tv.resize(p.el.clientWidth,p.el.clientHeight-24)
      })
    })
    c._ro.observe(wrap)
  }

  // Connect WS for real-time kline updates
  connectChartWS(c)

  if(loading)loading.classList.add('hidden')
}

/* ═══════════════════════════════════════════════
   INDICATORS — apply/remove
═══════════════════════════════════════════════ */
function applyAllIndicators(c){
  // Clear overlay indicators
  ;['sma20','sma50','sma200','ema9','ema21','ema55','bb_mid','bb_upper','bb_lower','vwap'].forEach(k=>{
    if(c.series[k]){try{c.tv.removeSeries(c.series[k])}catch(_){}; delete c.series[k]}
  })

  // Add overlay indicators
  if(c.indicators.has('sma20'))addOverlaySeries(c,'sma20',calcSMA(c.data,20),IND_COLORS.sma20)
  if(c.indicators.has('sma50'))addOverlaySeries(c,'sma50',calcSMA(c.data,50),IND_COLORS.sma50)
  if(c.indicators.has('sma200'))addOverlaySeries(c,'sma200',calcSMA(c.data,200),IND_COLORS.sma200)
  if(c.indicators.has('ema9'))addOverlaySeries(c,'ema9',calcEMA(c.data,9),IND_COLORS.ema9,1)
  if(c.indicators.has('ema21'))addOverlaySeries(c,'ema21',calcEMA(c.data,21),IND_COLORS.ema21,1)
  if(c.indicators.has('ema55'))addOverlaySeries(c,'ema55',calcEMA(c.data,55),IND_COLORS.ema55,1)
  if(c.indicators.has('vwap'))addOverlaySeries(c,'vwap',calcVWAP(c.data),IND_COLORS.vwap,1,'dashed')

  if(c.indicators.has('bb')){
    const bb=calcBB(c.data)
    addOverlaySeries(c,'bb_mid',bb.mid,IND_COLORS.bb_mid,1,'dotted')
    addOverlaySeries(c,'bb_upper',bb.upper,IND_COLORS.bb_upper,1,'dashed')
    addOverlaySeries(c,'bb_lower',bb.lower,IND_COLORS.bb_lower,1,'dashed')
  }

  // Volume — as histogram on main chart with separate price scale
  if(c.indicators.has('vol')){
    if(!c.series.vol){
      c.series.vol=c.tv.addHistogramSeries({
        priceFormat:{type:'volume'},
        priceScaleId:'vol',
        scaleMargins:{top:0.8,bottom:0}
      })
    }
    c.series.vol.setData(c.data.map(d=>({
      time:d.time,value:d.volume,
      color:d.close>=d.open?'rgba(0,212,138,.4)':'rgba(255,56,96,.4)'
    })))
  }else{
    if(c.series.vol){try{c.tv.removeSeries(c.series.vol)}catch(_){}; delete c.series.vol}
  }

  // Sub-panels
  buildSubPanel(c,'rsi',c.indicators.has('rsi'))
  buildSubPanel(c,'macd',c.indicators.has('macd'))
}

function addOverlaySeries(c,key,data,color,lineWidth=1,style='solid'){
  const styleMap={'solid':0,'dashed':1,'dotted':2,'large_dashed':3,'sparse_dotted':4}
  if(c.series[key]){try{c.tv.removeSeries(c.series[key])}catch(_){}}
  c.series[key]=c.tv.addLineSeries({color,lineWidth,lineStyle:styleMap[style]||0,crosshairMarkerVisible:false,lastValueVisible:false,priceLineVisible:false})
  c.series[key].setData(data)
}

function buildSubPanel(c,type,active){
  if(!active){
    if(c.indPanels[type]){
      if(c.indPanels[type].el)c.indPanels[type].el.remove()
      if(c.indPanels[type].tv){try{c.indPanels[type].tv.remove()}catch(_){}}
      delete c.indPanels[type]
      // Resize main chart
      setTimeout(()=>{ if(c.tv){const w=c.el.querySelector('.chart-wrap');c.tv.resize(w.clientWidth,w.clientHeight)} },50)
    }
    return
  }
  if(c.indPanels[type])return // already exists

  const panelEl=document.createElement('div')
  panelEl.className='ind-panel'
  panelEl.innerHTML=`<div class="ind-panel-label">${type.toUpperCase()}</div><button class="ind-panel-close" onclick="removeIndPanel(${c.id},'${type}')">✕</button>`
  c.el.appendChild(panelEl)

  const tv=LightweightCharts.createChart(panelEl,{
    ...getThemeOpts(),
    width:panelEl.clientWidth,height:panelEl.clientHeight-24,
    timeScale:{visible:false},
    rightPriceScale:{scaleMargins:{top:.1,bottom:.1}},
    leftPriceScale:{visible:false},
  })

  // Sync time range with main chart
  c.tv.timeScale().subscribeVisibleLogicalRangeChange(range=>{
    if(range&&tv)tv.timeScale().setVisibleLogicalRange(range)
  })

  const p={tv,el:panelEl,series:{}}

  if(type==='rsi'){
    const rsiData=calcRSI(c.data)
    p.series.rsi=tv.addLineSeries({color:IND_COLORS.rsi,lineWidth:1,lastValueVisible:true,priceLineVisible:false})
    p.series.rsi.setData(rsiData)
    // Overbought/oversold lines
    p.series.ob=tv.addLineSeries({color:'rgba(255,56,96,.4)',lineWidth:1,lineStyle:1,lastValueVisible:false,priceLineVisible:false})
    p.series.ob.setData(c.data.map(d=>({time:d.time,value:70})))
    p.series.os=tv.addLineSeries({color:'rgba(0,212,138,.4)',lineWidth:1,lineStyle:1,lastValueVisible:false,priceLineVisible:false})
    p.series.os.setData(c.data.map(d=>({time:d.time,value:30})))
  }

  if(type==='macd'){
    const macd=calcMACD(c.data)
    p.series.hist=tv.addHistogramSeries({lastValueVisible:false,priceLineVisible:false})
    p.series.hist.setData(macd.hist)
    p.series.line=tv.addLineSeries({color:IND_COLORS.macd_line,lineWidth:1,lastValueVisible:true,priceLineVisible:false})
    p.series.line.setData(macd.line)
    p.series.signal=tv.addLineSeries({color:IND_COLORS.macd_signal,lineWidth:1,lastValueVisible:true,priceLineVisible:false})
    p.series.signal.setData(macd.signal)
  }

  c.indPanels[type]=p
  setTimeout(()=>{
    if(c.tv){const w=c.el.querySelector('.chart-wrap');c.tv.resize(w.clientWidth,w.clientHeight)}
    if(tv)tv.resize(panelEl.clientWidth,panelEl.clientHeight-24)
  },50)
}

function removeIndPanel(chartId,type){
  const c=CHARTS.find(x=>x.id===chartId);if(!c)return
  c.indicators.delete(type)
  buildSubPanel(c,type,false)
  updateIndChecks(c)
}

/* ═══════════════════════════════════════════════
   WEBSOCKET per chart (kline stream)
═══════════════════════════════════════════════ */
function connectChartWS(c){
  if(c.ws){try{c.ws.close()}catch(_){}}
  const stream=`${c.sym.toLowerCase()}@kline_${c.tf}`
  const ws=new WebSocket(`wss://stream.binance.com:9443/ws/${stream}`)
  c.ws=ws
  ws.onmessage=ev=>{
    try{
      const msg=JSON.parse(ev.data);const k=msg.k
      if(!k)return
      const bar={time:k.t/1000,open:+k.o,high:+k.h,low:+k.l,close:+k.c,volume:+k.v}
      // Update or append
      const last=c.data[c.data.length-1]
      if(last&&last.time===bar.time){c.data[c.data.length-1]=bar}
      else{c.data.push(bar);if(c.data.length>KLINE_LIMIT)c.data.shift()}
      if(c.series.candle)c.series.candle.update(bar)
      if(c.series.vol)c.series.vol.update({time:bar.time,value:bar.volume,color:bar.close>=bar.open?'rgba(0,212,138,.4)':'rgba(255,56,96,.4)'})
      // Update price in toolbar
      updateChartTitle(c)
    }catch(_){}
  }
  ws.onclose=()=>{
    if(c._wsAlive!==false)setTimeout(()=>connectChartWS(c),3000)
  }
}

/* ═══════════════════════════════════════════════
   CHART DOM
═══════════════════════════════════════════════ */
function createChartDOM(c){
  const el=document.createElement('div')
  el.className='chart-panel'
  el.id=`chart-${c.id}`
  el.dataset.chartId=c.id
  el.onclick=()=>focusChart(c.id)

  const tfBtns=TFRAMES.map(tf=>`<button class="tfbtn${tf===c.tf?' on':''}" onclick="changeTF(${c.id},'${tf}',event)">${TF_LABELS[tf]}</button>`).join('')

  el.innerHTML=`
    <div class="ct" id="ct-${c.id}">
      <div class="ct-sym" onclick="openSymPicker(${c.id},this)">
        <span class="ct-sym-name">${c.sym.replace('USDT','')}</span>
        <span class="ct-sym-quote">/USDT</span>
      </div>
      <div class="ct-tfs">${tfBtns}</div>
      <button class="ind-btn" onclick="openIndPicker(${c.id},this)">INDICADORES ﹀</button>
      <div class="ct-info" id="ci-${c.id}"></div>
      <div class="ct-right">
        <button class="ct-close" title="Fechar gráfico" onclick="closeChart(${c.id},event)">✕</button>
      </div>
    </div>
    <div class="chart-wrap" id="cw-${c.id}"></div>
    <div class="chart-loading" id="cl-${c.id}">
      <div class="cl-spin"></div>
      <div class="cl-txt">${c.sym} ${c.tf}</div>
    </div>
  `
  c.el=el
  return el
}

function updateChartTitle(c){
  const nameEl=c.el?.querySelector('.ct-sym-name');if(!nameEl)return
  // Find price from latest data
  const last=c.data[c.data.length-1];if(!last)return
  // Just update the info bar with latest close
  const el=c.el.querySelector('.ct-info');if(el&&!el.innerHTML.trim()){
    el.innerHTML=`<span class="ci-c" style="font-weight:700">${fP(last.close)}</span>`
  }
}

/* ═══════════════════════════════════════════════
   ADD / REMOVE CHARTS
═══════════════════════════════════════════════ */
function addChart(sym='BTCUSDT',tf='4h'){
  const slots=LAYOUT_SLOTS[LAYOUT]||1
  // Check if there's an empty slot
  const area=document.getElementById('chart-area')
  const emptySlot=area.querySelector('.empty-slot')

  const c=createChartInstance(sym,tf)
  CHARTS.push(c)

  const dom=createChartDOM(c)

  if(emptySlot){
    area.replaceChild(dom,emptySlot)
  }else{
    // If at layout limit, expand layout
    if(CHARTS.length>slots){
      const layouts={2:'2h',3:'3l',4:4,5:4,6:6}
      const newL=layouts[CHARTS.length]||6
      if(newL!==LAYOUT)setLayout(newL)
    }
    area.appendChild(dom)
  }

  focusChart(c.id)
  buildChart(c)
  return c
}

function quickAddChart(sym){
  // If focused chart has empty data or add to new
  const c=CHARTS.find(x=>x.id===FOCUSED_ID)
  if(c&&CHARTS.length<=1){
    changeSymbol(c.id,sym)
  }else{
    addChart(sym,'4h')
  }
}

function closeChart(chartId,ev){
  if(ev){ev.stopPropagation()}
  const c=CHARTS.find(x=>x.id===chartId);if(!c)return
  if(c.ws){c._wsAlive=false;try{c.ws.close()}catch(_){}}
  if(c._ro)c._ro.disconnect()
  if(c.tv){try{c.tv.remove()}catch(_){}}
  Object.values(c.indPanels).forEach(p=>{if(p.tv){try{p.tv.remove()}catch(_){}}})
  if(c.el){
    // Replace with empty slot
    const area=document.getElementById('chart-area')
    const emptySlot=document.createElement('div')
    emptySlot.className='empty-slot'
    emptySlot.innerHTML=`<div class="es-icon">+</div><div class="es-tx">Clica para adicionar gráfico</div>`
    emptySlot.onclick=()=>convertSlotToChart(emptySlot,'BTCUSDT','4h')
    area.replaceChild(emptySlot,c.el)
  }
  CHARTS=CHARTS.filter(x=>x.id!==chartId)
  if(FOCUSED_ID===chartId)FOCUSED_ID=CHARTS[0]?.id||null
}

function convertSlotToChart(slotEl,sym,tf){
  const area=document.getElementById('chart-area')
  const c=createChartInstance(sym,tf)
  CHARTS.push(c)
  const dom=createChartDOM(c)
  area.replaceChild(dom,slotEl)
  focusChart(c.id)
  buildChart(c)
}

function focusChart(id){
  FOCUSED_ID=id
  document.querySelectorAll('.chart-panel').forEach(el=>el.classList.remove('focused'))
  const el=document.getElementById(`chart-${id}`)
  if(el)el.classList.add('focused')
}

/* ═══════════════════════════════════════════════
   CHANGE SYMBOL / TIMEFRAME
═══════════════════════════════════════════════ */
function changeTF(chartId,tf,ev){
  if(ev)ev.stopPropagation()
  const c=CHARTS.find(x=>x.id===chartId);if(!c)return
  c.tf=tf
  // Update TF button states
  c.el.querySelectorAll('.tfbtn').forEach(b=>b.classList.remove('on'))
  const active=Array.from(c.el.querySelectorAll('.tfbtn')).find(b=>b.textContent===TF_LABELS[tf])
  if(active)active.classList.add('on')
  buildChart(c)
}

function changeSymbol(chartId,sym){
  const c=CHARTS.find(x=>x.id===chartId);if(!c)return
  c.sym=sym
  const q=sym.endsWith('USDC')?'USDC':sym.endsWith('BTC')?'BTC':'USDT'
  const base=sym.replace(q,'')
  const nameEl=c.el?.querySelector('.ct-sym-name');if(nameEl)nameEl.textContent=base
  const quoteEl=c.el?.querySelector('.ct-sym-quote');if(quoteEl)quoteEl.textContent='/'+q
  buildChart(c)
}

/* ═══════════════════════════════════════════════
   SYMBOL PICKER
═══════════════════════════════════════════════ */
function openSymPicker(chartId,anchorEl){
  const picker=document.getElementById('sym-picker')
  const activePickerWasThis=ACTIVE_PICKER?.type==='sym'&&ACTIVE_PICKER?.chartId===chartId
  closeAllPickers()
  if(activePickerWasThis)return

  ACTIVE_PICKER={type:'sym',chartId}
  const rect=anchorEl.getBoundingClientRect()
  picker.style.display='block'
  picker.style.left=rect.left+'px'
  picker.style.top=(rect.bottom+4)+'px'

  const input=document.getElementById('sp-search')
  input.value='';input.focus()
  renderSymPicker('')
}

function filterSymPicker(){
  const q=document.getElementById('sp-search').value.toUpperCase().trim()
  renderSymPicker(q)
}

function renderSymPicker(query){
  const el=document.getElementById('sp-list')
  const syms=ALL_SYMBOLS.filter(s=>!query||s.symbol.includes(query)).slice(0,80)
  el.innerHTML=syms.map(s=>`
    <div class="sp-item" onclick="selectSymbol('${s.symbol}')">
      <span class="sp-sym">${s.symbol}</span>
      <span class="sp-vol">${fV(s.volume)}</span>
    </div>`).join('')
}

function selectSymbol(sym){
  if(ACTIVE_PICKER?.type==='sym'){changeSymbol(ACTIVE_PICKER.chartId,sym)}
  closeAllPickers()
}

/* ═══════════════════════════════════════════════
   INDICATOR PICKER
═══════════════════════════════════════════════ */
function openIndPicker(chartId,anchorEl){
  const picker=document.getElementById('ind-picker')
  const activePickerWasThis=ACTIVE_PICKER?.type==='ind'&&ACTIVE_PICKER?.chartId===chartId
  closeAllPickers()
  if(activePickerWasThis)return

  ACTIVE_PICKER={type:'ind',chartId}
  const c=CHARTS.find(x=>x.id===chartId)
  if(c)updateIndChecks(c)

  const rect=anchorEl.getBoundingClientRect()
  picker.style.display='block'
  picker.style.left=rect.left+'px'
  picker.style.top=(rect.bottom+4)+'px'
}

function toggleIndicator(key){
  if(!ACTIVE_PICKER||ACTIVE_PICKER.type!=='ind')return
  const c=CHARTS.find(x=>x.id===ACTIVE_PICKER.chartId);if(!c)return
  if(c.indicators.has(key))c.indicators.delete(key)
  else c.indicators.add(key)
  updateIndChecks(c)
  applyAllIndicators(c)
}

function updateIndChecks(c){
  const keys=['sma20','sma50','sma200','ema9','ema21','ema55','bb','rsi','macd','vol','vwap']
  keys.forEach(k=>{
    const el=document.getElementById('ic-'+k)
    if(el)el.textContent=c.indicators.has(k)?'✓':''
  })
}

function closeAllPickers(){
  document.getElementById('sym-picker').style.display='none'
  document.getElementById('ind-picker').style.display='none'
  ACTIVE_PICKER=null
}

document.addEventListener('click',e=>{
  if(!e.target.closest('#sym-picker')&&!e.target.closest('.ct-sym')&&
     !e.target.closest('#ind-picker')&&!e.target.closest('.ind-btn')){
    closeAllPickers()
  }
})

/* ═══════════════════════════════════════════════
   MAIN WEBSOCKET for sidebar prices
═══════════════════════════════════════════════ */
function connectMainWS(){
  if(MAIN_WS){try{MAIN_WS.close()}catch(_){}}
  // Subscribe top 50 USDT miniTickers
  const top50=ALL_SYMBOLS.slice(0,50).map(s=>s.symbol.toLowerCase()+'@miniTicker')
  const url=`wss://stream.binance.com:9443/stream?streams=${top50.join('/')}`
  const ws=new WebSocket(url)
  MAIN_WS=ws
  const dot=document.getElementById('ws-dot-main')
  const txt=document.getElementById('ws-status-txt')
  if(dot)dot.className='ws-dot wait'
  ws.onopen=()=>{if(dot){dot.className='ws-dot ok';txt.textContent='AO VIVO'}}
  ws.onmessage=ev=>{
    try{const d=JSON.parse(ev.data)?.data||JSON.parse(ev.data)
      if(!d?.s)return
      const idx=ALL_SYMBOLS.findIndex(s=>s.symbol===d.s)
      if(idx>=0){ALL_SYMBOLS[idx].price=+d.c;const op=+d.o;if(op>0)ALL_SYMBOLS[idx].change=(+d.c-op)/op*100}
      updateSidebarPrices(d.s,+d.c,(ALL_SYMBOLS.find(s=>s.symbol===d.s)||{}).change||0)
    }catch(_){}}
  ws.onerror=()=>{if(dot)dot.className='ws-dot err';if(txt)txt.textContent='ERRO'}
  ws.onclose=()=>{if(dot)dot.className='ws-dot err';setTimeout(connectMainWS,5000)}
}

/* ═══════════════════════════════════════════════
   FORMAT HELPERS
═══════════════════════════════════════════════ */
function fP(n){
  if(!n&&n!==0)return'—'
  if(n>=10000)return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})
  if(n>=100)return n.toFixed(3)
  if(n>=1)return n.toFixed(4)
  if(n>=.01)return n.toFixed(5)
  return n.toFixed(6)
}
function fV(n){
  if(!n)return'—'
  if(n>=1e9)return(n/1e9).toFixed(1)+'B'
  if(n>=1e6)return(n/1e6).toFixed(1)+'M'
  if(n>=1e3)return(n/1e3).toFixed(0)+'K'
  return n.toFixed(0)
}

/* ═══════════════════════════════════════════════
   BOOT
═══════════════════════════════════════════════ */
async function boot(){
  await loadSymbols()
  connectMainWS()
  // Start with one BTC chart
  setLayout(1)
  addChart('BTCUSDT','4h')
}

boot()

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Multi-Market USDC Monitor</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0b0e11; color: #eaecef; margin: 20px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .tab-btn { background: #2b3139; border: none; color: white; padding: 10px 20px; cursor: pointer; border-radius: 4px; }
        .tab-btn.active { background: #f0b90b; color: black; font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #2b3139; }
        th { color: #848e9c; font-weight: 400; }
        
        .buy { color: #0ecb81; } .sell { color: #f6465d; }
        .alert-btn { background: #333; border: 1px solid #444; color: #f0b90b; cursor: pointer; padding: 4px 8px; border-radius: 3px; font-size: 11px; }
        .alert-active { background: #f0b90b1a; border-color: #f0b90b; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('spot')">USDC SPOT</button>
        <button class="tab-btn" onclick="switchTab('futures')">USDC FUTURES (PERP)</button>
    </div>

    <div id="spotSection">
        <table id="spotTable">
            <thead>
                <tr>
                    <th>Símbolo</th><th>Preço</th><th>Vol Buy%</th><th>Vol Sell%</th><th>Agressividade</th><th>Alerta</th>
                </tr>
            </thead>
            <tbody id="spotBody"></tbody>
        </table>
    </div>

    <div id="futuresSection" class="hidden">
        <table id="futuresTable">
            <thead>
                <tr>
                    <th>Símbolo</th><th>Preço</th><th>Vol Buy%</th><th>Vol Sell%</th><th>Agressividade</th><th>Alerta</th>
                </tr>
            </thead>
            <tbody id="futuresBody"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
